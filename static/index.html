          <div style={{marginTop:16,display:"flex",gap:8,alignItems:"center"}}>
            <span style={{fontSize:13,fontWeight:600,color:C.navy}}>Payment method:</span>
            <button onClick={()=>setPayingWith("card")} style={{padding:"6px 14px",borderRadius:6,border:`1px solid ${payingWith==="card"?C.navy:C.border}`,background:payingWith==="card"?C.navy:"#fff",color:payingWith==="card"?"#fff":C.dark,fontSize:12,fontWeight:600,cursor:"pointer"}}>Credit Card</button>
            <button onClick={()=>setPayingWith("ach")} style={{padding:"6px 14px",borderRadius:6,border:`1px solid ${payingWith==="ach"?C.green:C.border}`,background:payingWith==="ach"?"#f0fdf4":"#fff",color:payingWith==="ach"?C.green:C.dark,fontSize:12,fontWeight:600,cursor:"pointer"}}>
              ACH / Bank Transfer {options[selectedOption]?.achEligible ? "(Save $100)" : ""}
            </button>
          </div>
          <button onClick={doAccept} disabled={!sigName||!sigDate||submitting} style={{display:"block",width:"100%",marginTop:20,padding:"14px 0",border:"none",borderRadius:8,background:sigName&&sigDate&&!submitting?C.orange:"#cbd5e1",color:"#fff",fontSize:15,fontWeight:700,cursor:sigName&&sigDate&&!submitting?"pointer":"not-allowed"}}>
            {submitting?"Submitting...":"Accept Proposal and Pay Deposit"}
          </button>
        </>}
      </div>
    </div>
  </div>);
}

// ─── DASHBOARD ───
function Dashboard({onBack}) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("proposals");

  useEffect(() => {
    authFetch(`${API}/api/dashboard`).then(r=>r.json()).then(d=>{setData(d);setLoading(false);}).catch(()=>setLoading(false));
  }, []);

  const fmtDate = d => d ? new Date(d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}) : "—";
  const fmtMoney = cents => cents ? `$${(cents/100).toLocaleString("en-US",{minimumFractionDigits:2})}` : "$0.00";
  const statusColor = s => ({draft:"#94a3b8",sent:"#3b82f6",viewed:"#8b5cf6",signed:"#16a34a",paid:"#16a34a"}[s]||"#94a3b8");
  const statusLabel = s => ({draft:"Draft",sent:"Sent",viewed:"Viewed",signed:"Signed",paid:"Paid"}[s]||"Draft");

  const statCard = (label, value, color) => (
    <div style={{flex:1,minWidth:120,background:"#fff",borderRadius:10,padding:"18px 16px",border:`1px solid ${C.border}`,textAlign:"center"}}>
      <div style={{fontSize:28,fontWeight:800,color:color||C.navy,fontFamily:"'Playfair Display',serif"}}>{value}</div>
      <div style={{fontSize:11,fontWeight:600,color:C.gray,textTransform:"uppercase",letterSpacing:0.5,marginTop:4}}>{label}</div>
    </div>
  );

  const tabBtn = (key, label) => (
    <button onClick={()=>setTab(key)} style={{padding:"8px 20px",borderRadius:6,border:`1px solid ${tab===key?C.navy:C.border}`,
      background:tab===key?C.navy:"#fff",color:tab===key?"#fff":C.dark,fontSize:13,fontWeight:600,cursor:"pointer",transition:"all 0.15s"}}>
      {label}
    </button>
  );

  const thStyle = {padding:"10px 12px",textAlign:"left",fontSize:11,fontWeight:700,color:C.gray,textTransform:"uppercase",letterSpacing:0.5,borderBottom:`2px solid ${C.border}`,whiteSpace:"nowrap"};
  const tdStyle = {padding:"10px 12px",fontSize:13,color:C.dark,borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:200};

  if(loading) return <div style={{minHeight:"60vh",display:"flex",alignItems:"center",justifyContent:"center",color:C.gray}}>Loading dashboard...</div>;
  if(!data) return <div style={{textAlign:"center",color:C.gray,padding:40}}>Failed to load dashboard data.</div>;

  const {stats, proposals, signatures, payments} = data;

  return (<div style={{maxWidth:1100,margin:"0 auto"}}>
    <div style={{textAlign:"center",marginBottom:28}}>
      <div style={{fontSize:11,fontWeight:700,color:C.orange,letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>ReDry Proposal Builder</div>
      <h1 style={{fontSize:28,fontWeight:800,color:C.navy,margin:0,fontFamily:"'Playfair Display',serif"}}>Database Dashboard</h1>
      <p style={{color:C.gray,fontSize:14,marginTop:6}}>Overview of all proposals, signatures, and payments.</p>
      <button onClick={onBack} style={{marginTop:10,background:"none",border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 18px",cursor:"pointer",fontSize:13,fontWeight:600,color:C.navy,transition:"all 0.15s"}}
        onMouseEnter={e=>{e.currentTarget.style.borderColor=C.orange;e.currentTarget.style.color=C.orange}} onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.navy}}>
        &larr; Back to Builder
      </button>
    </div>

    {/* Stats cards */}
    <div style={{display:"flex",gap:12,marginBottom:24,flexWrap:"wrap"}}>
      {statCard("Total Proposals", stats.totalProposals, C.navy)}
      {statCard("Sent", stats.sent, "#3b82f6")}
      {statCard("Viewed", stats.viewed, "#8b5cf6")}
      {statCard("Signed", stats.signed, C.green)}
      {statCard("Paid", stats.paid, C.green)}
      {statCard("Revenue", fmtMoney(stats.totalRevenue), C.orange)}
    </div>

    {/* Tabs */}
    <div style={{display:"flex",gap:8,marginBottom:16}}>
      {tabBtn("proposals", `Proposals (${proposals.length})`)}
      {tabBtn("signatures", `Signatures (${signatures.length})`)}
      {tabBtn("payments", `Payments (${payments.length})`)}
    </div>

    {/* Proposals table */}
    {tab==="proposals" && <div style={{background:"#fff",borderRadius:10,border:`1px solid ${C.border}`,overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>
          <th style={thStyle}>Project</th><th style={thStyle}>Company</th><th style={thStyle}>Contact</th>
          <th style={thStyle}>Email</th><th style={thStyle}>Status</th><th style={thStyle}>Created</th>
          <th style={thStyle}>Sent</th><th style={thStyle}>Viewed</th><th style={thStyle}>Signed</th><th style={thStyle}>Paid</th>
        </tr></thead>
        <tbody>
          {proposals.length===0 && <tr><td colSpan={10} style={{...tdStyle,textAlign:"center",color:C.gray,padding:30}}>No proposals yet.</td></tr>}
          {proposals.map(p=>(
            <tr key={p.id} style={{transition:"background 0.1s"}} onMouseEnter={e=>e.currentTarget.style.background="#f8f9fb"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              <td style={tdStyle}><span style={{fontWeight:600,color:C.navy}}>{p.projectName||"Untitled"}</span><br/><span style={{fontSize:10,color:C.gray}}>{p.id.slice(0,12)}...</span></td>
              <td style={tdStyle}>{p.clientCompany||"—"}</td>
              <td style={tdStyle}>{p.clientContact||"—"}</td>
              <td style={tdStyle}>{p.clientEmail||"—"}</td>
              <td style={tdStyle}><span style={{display:"inline-block",padding:"3px 10px",borderRadius:12,fontSize:11,fontWeight:700,color:"#fff",background:statusColor(p.status)}}>{statusLabel(p.status)}</span></td>
              <td style={tdStyle}>{fmtDate(p.createdAt)}</td>
              <td style={tdStyle}>{fmtDate(p.sentAt)}</td>
              <td style={tdStyle}>{fmtDate(p.viewedAt)}</td>
              <td style={tdStyle}>{fmtDate(p.signedAt)}</td>
              <td style={tdStyle}>{fmtDate(p.paidAt)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>}

    {/* Signatures table */}
    {tab==="signatures" && <div style={{background:"#fff",borderRadius:10,border:`1px solid ${C.border}`,overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>
          <th style={thStyle}>Project</th><th style={thStyle}>Signer</th><th style={thStyle}>Date Signed</th>
          <th style={thStyle}>Option Selected</th><th style={thStyle}>Signed At</th>
        </tr></thead>
        <tbody>
          {signatures.length===0 && <tr><td colSpan={5} style={{...tdStyle,textAlign:"center",color:C.gray,padding:30}}>No signatures yet.</td></tr>}
          {signatures.map(s=>(
            <tr key={s.id} onMouseEnter={e=>e.currentTarget.style.background="#f8f9fb"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              <td style={tdStyle}><span style={{fontWeight:600,color:C.navy}}>{s.projectName||"—"}</span><br/><span style={{fontSize:10,color:C.gray}}>{s.proposalId.slice(0,12)}...</span></td>
              <td style={tdStyle}>{s.signerName}</td>
              <td style={tdStyle}>{s.signerDate||"—"}</td>
              <td style={tdStyle}><span style={{display:"inline-block",padding:"3px 10px",borderRadius:12,fontSize:11,fontWeight:700,color:"#fff",background:C.orange}}>Option {s.selectedOption}</span></td>
              <td style={tdStyle}>{fmtDate(s.signedAt)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>}

    {/* Payments table */}
    {tab==="payments" && <div style={{background:"#fff",borderRadius:10,border:`1px solid ${C.border}`,overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>
          <th style={thStyle}>Project</th><th style={thStyle}>Option</th><th style={thStyle}>Payment #</th>
          <th style={thStyle}>Amount</th><th style={thStyle}>Method</th><th style={thStyle}>Paid At</th>
        </tr></thead>
        <tbody>
          {payments.length===0 && <tr><td colSpan={6} style={{...tdStyle,textAlign:"center",color:C.gray,padding:30}}>No payments yet.</td></tr>}
          {payments.map(p=>(
            <tr key={p.id} onMouseEnter={e=>e.currentTarget.style.background="#f8f9fb"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              <td style={tdStyle}><span style={{fontWeight:600,color:C.navy}}>{p.projectName||"—"}</span><br/><span style={{fontSize:10,color:C.gray}}>{p.proposalId.slice(0,12)}...</span></td>
              <td style={tdStyle}>Option {p.optionNum}</td>
              <td style={tdStyle}>#{p.paymentNumber}</td>
              <td style={tdStyle}><span style={{fontWeight:700,color:C.green}}>{fmtMoney(p.amountCents)}</span></td>
              <td style={tdStyle}><span style={{display:"inline-block",padding:"3px 10px",borderRadius:12,fontSize:11,fontWeight:600,
                background:p.method==="ach"?"#f0fdf4":"#fef7ed",color:p.method==="ach"?C.green:C.orange}}>{p.method==="ach"?"ACH":"Card"}</span></td>
              <td style={tdStyle}>{fmtDate(p.paidAt)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>}

    <div style={{textAlign:"center",color:C.gray,fontSize:11,marginTop:16,paddingBottom:20}}>
      Data loaded from PostgreSQL &bull; {proposals.length} proposals &bull; {signatures.length} signatures &bull; {payments.length} payments
    </div>
  </div>);
}

// ─── MAIN ───
function ProposalSearch({onLoad, onBack}) {
  const [proposals, setProposals] = React.useState([]);
  const [search, setSearch] = React.useState("");
  const [loading, setLoading] = React.useState(true);

  React.useEffect(()=>{
    authFetch(`${API}/api/proposals`).then(r=>r.json()).then(d=>{setProposals(d);setLoading(false);}).catch(()=>setLoading(false));
  },[]);

  const statusColor = s => ({draft:"#94a3b8",sent:"#3b82f6",viewed:"#8b5cf6",signed:"#16a34a",paid:"#16a34a"}[s]||"#94a3b8");
  const statusLabel = s => ({draft:"Draft",sent:"Sent",viewed:"Viewed",signed:"Signed",paid:"Paid"}[s]||"Draft");
  const fmtDate = d => d ? new Date(d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "";

  const q = search.toLowerCase();
  const filtered = proposals.filter(p =>
    (p.projectName||"").toLowerCase().includes(q) ||
    (p.clientCompany||"").toLowerCase().includes(q) ||
    (p.clientContact||"").toLowerCase().includes(q) ||
    (p.clientEmail||"").toLowerCase().includes(q) ||
    (p.id||"").toLowerCase().includes(q)
  );

  return (<div style={{maxWidth:820,margin:"0 auto"}}>
    <div style={{textAlign:"center",marginBottom:24}}>
      <div style={{fontSize:11,fontWeight:700,color:C.orange,letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>ReDry Proposal Builder</div>
      <h1 style={{fontSize:28,fontWeight:800,color:C.navy,margin:0,fontFamily:"'Playfair Display',serif"}}>Past Proposals</h1>
      <p style={{color:C.gray,fontSize:14,marginTop:6}}>Search and load a previous proposal to edit or resend.</p>
    </div>

    <div style={{display:"flex",gap:10,marginBottom:20,alignItems:"center"}}>
      <button onClick={onBack} style={{background:C.navy,color:"#fff",border:"none",borderRadius:6,padding:"10px 18px",cursor:"pointer",fontWeight:700,fontSize:13,whiteSpace:"nowrap"}}>
        &larr; New Proposal
      </button>
      <input type="text" placeholder="Search by project, company, contact, or ID..." value={search} onChange={e=>setSearch(e.target.value)}
        style={{flex:1,padding:"10px 14px",border:`1px solid ${C.border}`,borderRadius:6,fontSize:14,outline:"none"}} />
    </div>

    {loading && <div style={{textAlign:"center",color:C.gray,padding:40}}>Loading proposals...</div>}

    {!loading && filtered.length === 0 && <div style={{textAlign:"center",color:C.gray,padding:40}}>
      {search ? "No proposals match your search." : "No proposals found."}
    </div>}

    {!loading && filtered.map(p => (
      <div key={p.id} onClick={()=>onLoad(p.id)} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",
        background:"#fff",border:`1px solid ${C.border}`,borderRadius:8,marginBottom:8,cursor:"pointer",
        transition:"all 0.15s"}} onMouseEnter={e=>e.currentTarget.style.borderColor=C.orange} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,fontWeight:700,color:C.navy,marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
            {p.projectName || "Untitled"}
          </div>
          <div style={{fontSize:12,color:C.gray,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
            {p.clientCompany}{p.clientContact ? ` \u2022 ${p.clientContact}` : ""}
          </div>
        </div>
        <div style={{textAlign:"right",flexShrink:0}}>
          <div style={{fontSize:11,fontWeight:700,color:statusColor(p.status),textTransform:"uppercase",letterSpacing:0.5,marginBottom:2}}>
            {statusLabel(p.status)}
          </div>
          <div style={{fontSize:11,color:C.gray}}>{fmtDate(p.createdAt)}</div>
        </div>
        <div style={{color:C.gray,fontSize:16,flexShrink:0}}>&rsaquo;</div>
      </div>
    ))}

    {!loading && filtered.length > 0 && <div style={{textAlign:"center",color:C.gray,fontSize:12,marginTop:12}}>
      {filtered.length} proposal{filtered.length !== 1 ? "s" : ""}
    </div>}
  </div>);
}

function App() {
  const [view,setView] = useState("loading");
  const [leaseType,setLeaseType] = useState(null);
  const [form,setForm] = useState(loadForm);
  const [fixedForm,setFixedForm] = useState(loadFixedForm);
  const [ventMapFile,setVentMapFile] = useState(null);
  const [ventMapUrl,setVentMapUrl] = useState(null);
  const [loading,setLoading] = useState(null);
  const [result,setResult] = useState(null);
  const [proposalId,setProposalId] = useState(null);
  const [taxRate,setTaxRate] = useState(0);
  const [authed,setAuthed] = useState(false);

  const activeForm = leaseType === "fixed" ? fixedForm : form;
  const setActiveForm = leaseType === "fixed" ? setFixedForm : setForm;

  useEffect(()=>{
    const path = window.location.pathname;
    const match = path.match(/^\/proposal\/([a-f0-9]+)$/);
    if(match) {
      const id = match[1];
      setProposalId(id);
      fetch(`${API}/api/proposal/${id}`).then(r=>{
        if(!r.ok) throw new Error("not found");
        return r.json();
      }).then(cfg=>{
        if(cfg.error) throw new Error(cfg.error);
        const ventFile = cfg._ventMapFilename;
        delete cfg._ventMapFilename; delete cfg._createdAt;
        if(cfg.leaseType === "fixed") {
          setLeaseType("fixed");
          setFixedForm(f=>({...f,...cfg}));
        } else {
          setLeaseType("performance");
          setForm(f=>({...f,...cfg}));
        }
        if(ventFile) setVentMapUrl(`${API}/api/proposal/${id}/ventmap`);
        setAuthed(true);
        setView("client");
      }).catch(()=>{setView("not-found");});
    } else {
      fetch(`${API}/api/auth/check`).then(r=>r.json()).then(d=>{
        if(d.authenticated || !d.authRequired) { setAuthed(true); setView("lease-select"); }
        else setView("login");
      }).catch(()=>setView("login"));
    }
  },[]);

  useEffect(()=>{
    if(ventMapFile){const u=URL.createObjectURL(ventMapFile);setVentMapUrl(u);return()=>URL.revokeObjectURL(u);}
  },[ventMapFile]);

  const doLogout=()=>{
    authFetch(`${API}/api/auth/logout`,{method:"POST"}).finally(()=>{
      _authToken="";setAuthed(false);setView("login");
    });
  };

  const buildFD=()=>{
    const fd=new FormData();
    const cfg={...activeForm, taxRate:String(taxRate), leaseType: leaseType || "performance"};
    if(cfg.taxRateOverride) cfg.taxRateOverride = String(parseFloat(cfg.taxRateOverride)/100);
    fd.append("config",JSON.stringify(cfg));
    if(ventMapFile)fd.append("ventMap",ventMapFile);
    return fd;
  };

  const validateForm=()=>{
    if(activeForm.showCustomOption){
      const t=(activeForm.customOptionPayments||[]).reduce((s,p)=>s+(parseFloat(p.pct)||0),0);
      if(t!==100){alert(`Custom option payment percentages must equal 100% (currently ${t}%).`);return false;}
    }
    return true;
  };

  const doPDF=async()=>{
    if(!validateForm())return;
    setLoading("pdf");setResult(null);
    try{
      const r=await authFetch(`${API}/api/generate-pdf`,{method:"POST",body:buildFD()});
      if(!r.ok)throw new Error("fail");
      const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement("a");
      a.href=u;a.download=`ReDry_Proposal_${activeForm.projectName.replace(/\s+/g,"_")}_${activeForm.projectSection.replace(/\s+/g,"_")}.pdf`;
      a.click();URL.revokeObjectURL(u);setResult({type:"pdf"});
    }catch(e){alert("Failed to generate PDF.");}
    setLoading(null);
  };

  const doLink=async()=>{
    if(!validateForm())return;
    setLoading("link");setResult(null);
    try{
      const r=await authFetch(`${API}/api/generate-proposal-link`,{method:"POST",body:buildFD()});
      if(!r.ok)throw new Error("fail");
      const d=await r.json();setResult({type:"link",...d});setProposalId(d.proposalId);
    }catch(e){alert("Failed to create link.");}
    setLoading(null);
  };

  if(view==="loading") return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:C.gray}}>Loading...</div>;
  if(view==="not-found") return (<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg}}>
    <div style={{textAlign:"center",padding:40}}>
      <div style={{width:72,height:72,borderRadius:"50%",background:"#fef2f2",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 20px",fontSize:32,color:"#dc2626"}}>!</div>
      <h1 style={{fontSize:24,fontWeight:800,color:C.navy,fontFamily:"'Playfair Display',serif"}}>Proposal Not Found</h1>
      <p style={{color:C.gray,fontSize:14,marginTop:8,lineHeight:1.6}}>This proposal link may be invalid or expired.</p>
    </div>
  </div>);
  if(view==="login") return <LoginScreen onLogin={()=>{setAuthed(true);setView("lease-select");}}/>;
  if(view==="lease-select") return <LeaseTypeSelector onSelect={(type)=>{setLeaseType(type);setResult(null);setView("form");}} onSearch={()=>setView("search")} onDashboard={()=>setView("dashboard")} onLogout={doLogout}/>;
  if(view==="client") {
    if(leaseType==="fixed") return <FixedLeaseClientView form={fixedForm} ventMapUrl={ventMapUrl} proposalId={proposalId} onBack={null}/>;
    return <ClientView form={form} ventMapUrl={ventMapUrl} proposalId={proposalId} onBack={null}/>;
  }
  if(view==="dashboard") return (<div style={{padding:"40px 20px"}}><Dashboard onBack={()=>setView("lease-select")}/></div>);
  if(view==="search") return (<div style={{padding:"40px 20px"}}><ProposalSearch onBack={()=>setView("lease-select")} onLoad={(pid)=>{
    authFetch(`${API}/api/proposal/${pid}`).then(r=>r.json()).then(cfg=>{
      const ventFile = cfg._ventMapFilename;
      delete cfg._ventMapFilename; delete cfg._createdAt;
      if(cfg.leaseType === "fixed") {
        setLeaseType("fixed");
        setFixedForm(f=>({...f,...cfg}));
      } else {
        setLeaseType("performance");
        setForm(f=>({...f,...cfg}));
      }
      setProposalId(pid);
      if(ventFile) setVentMapUrl(`${API}/api/proposal/${pid}/ventmap`);
      else { setVentMapUrl(null); setVentMapFile(null); }
      setView("form");
    }).catch(()=>alert("Failed to load proposal."));
  }}/></div>);
  if(leaseType==="fixed") return (<div style={{padding:"40px 20px"}}><FixedLeaseBuilder form={fixedForm} setForm={setFixedForm} ventMapFile={ventMapFile} setVentMapFile={setVentMapFile} onPDF={doPDF} onLink={doLink} loading={loading} result={result} onSetResult={setResult} taxRate={taxRate} setTaxRate={setTaxRate} onSearch={()=>setView("search")} onDashboard={()=>setView("dashboard")} onBack={()=>setView("lease-select")}/></div>);
  return (<div style={{padding:"40px 20px"}}><BuilderForm form={form} setForm={setForm} ventMapFile={ventMapFile} setVentMapFile={setVentMapFile} onPDF={doPDF} onLink={doLink} loading={loading} result={result} onSetResult={setResult} taxRate={taxRate} setTaxRate={setTaxRate} onSearch={()=>setView("search")} onDashboard={()=>setView("dashboard")} onBack={()=>setView("lease-select")}/></div>);
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  render() {
    if (this.state.hasError) return React.createElement("div", {style:{padding:40,textAlign:"center"}},
      React.createElement("h2", {style:{color:"#dc2626"}}, "Something went wrong"),
      React.createElement("pre", {style:{fontSize:12,color:"#64748b",marginTop:12,textAlign:"left",maxWidth:600,margin:"12px auto",whiteSpace:"pre-wrap"}}, String(this.state.error))
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ErrorBoundary, null, React.createElement(App)));
</script>
