// ─── Auth helpers ───
let _authToken = "";
function authHeaders() { return _authToken ? {"X-Auth-Token": _authToken} : {}; }
function authFetch(url, opts = {}) {
  opts.headers = {...(opts.headers||{}), ...authHeaders()};
  return fetch(url, opts);
}

function LoginScreen({onLogin}) {
  const [pw, setPw] = React.useState("");
  const [error, setError] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const doLogin = async (e) => {
    if(e) e.preventDefault(); setLoading(true); setError("");
    try {
      const r = await fetch(`${API}/api/auth/login`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({password:pw})});
      const d = await r.json();
      if(d.ok) { _authToken = d.token; onLogin(); }
      else setError(d.error || "Invalid password");
    } catch(err) { setError("Connection failed"); }
    setLoading(false);
  };
  return (<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg}}>
    <div style={{background:"#fff",borderRadius:12,padding:40,width:360,boxShadow:"0 4px 24px rgba(0,0,0,0.08)",textAlign:"center"}}>

      <h1 style={{fontSize:24,fontWeight:800,color:C.navy,margin:"0 0 8px",fontFamily:"'Playfair Display',serif"}}>Proposal Builder</h1>
      <p style={{color:C.gray,fontSize:13,marginBottom:24}}>Enter your team password to continue.</p>

        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Team password"

          style={{width:"100%",padding:"12px 14px",border:`1px solid ${error?C.red:C.border}`,borderRadius:8,fontSize:14,marginBottom:12,outline:"none",boxSizing:"border-box"}} />

          {loading ? "Signing in..." : "Sign In"}

      </div>
    </div>
  </div>);
}

// ─── Google Places Autocomplete loader ───
let _gmapsLoaded = false, _gmapsLoading = false, _gmapsCallbacks = [];
function loadGoogleMaps(apiKey) {
  return new Promise((resolve) => {
    if (_gmapsLoaded) return resolve();
    _gmapsCallbacks.push(resolve);
    if (_gmapsLoading) return;
    _gmapsLoading = true;
    window.__gmapsReady = () => { _gmapsLoaded = true; _gmapsCallbacks.forEach(cb => cb()); _gmapsCallbacks = []; };
    const s = document.createElement("script");
    s.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=places&callback=__gmapsReady`;
    s.async = true; s.defer = true;
    document.head.appendChild(s);
  });
}

function AddressAutocomplete({value, onChange, onPlaceSelect, placeholder, required}) {
  const inputRef = useRef(null);
  const acRef = useRef(null);
  const [gmapsReady, setGmapsReady] = useState(_gmapsLoaded);

  useEffect(() => {
    if (_gmapsLoaded) { setGmapsReady(true); return; }
    authFetch(`${API}/api/google-maps-key`).then(r=>r.json()).then(d=>{
      if(d.key) loadGoogleMaps(d.key).then(()=>setGmapsReady(true));
    }).catch(()=>{});
  }, []);

  useEffect(() => {
    if (!gmapsReady || !inputRef.current || acRef.current) return;
    const ac = new window.google.maps.places.Autocomplete(inputRef.current, {
      types: ["address"],
      componentRestrictions: { country: "us" },
      fields: ["address_components", "formatted_address"]
    });
    ac.addListener("place_changed", () => {
      const place = ac.getPlace();
      if (!place.address_components) return;
      let street = "", city = "", state = "", zip = "";
      for (const comp of place.address_components) {
        const t = comp.types;
        if (t.includes("street_number")) street = comp.long_name + " ";
        if (t.includes("route")) street += comp.short_name;
        if (t.includes("locality") || t.includes("sublocality_level_1")) city = comp.long_name;
        if (t.includes("administrative_area_level_1")) state = comp.short_name;
        if (t.includes("postal_code")) zip = comp.long_name;
      }
      onPlaceSelect({ address: street.trim(), city, state, zip });
    });
    acRef.current = ac;
  }, [gmapsReady]);

  // Keep input synced with controlled value when user types manually
  const handleChange = (e) => { onChange(e.target.value); };

  return (
    <div style={{flex:"1 1 100%",minWidth:0}}>
      <label style={{display:"block",fontSize:12,fontWeight:600,color:C.navy,marginBottom:4,letterSpacing:0.3}}>
        Street Address {required && <span style={{color:C.orange}}>*</span>}
        {gmapsReady && <span style={{fontWeight:400,color:C.gray,fontSize:11,marginLeft:6}}>&#x1F50D; powered by Google</span>}
      </label>
      <div style={{display:"flex",alignItems:"center",background:"#fff",border:`1px solid ${C.border}`,borderRadius:6,overflow:"hidden"}}>
        <input ref={inputRef} type="text" value={value} onChange={handleChange} placeholder={placeholder}
          autoComplete="off"
          style={{flex:1,padding:"8px 12px",border:"none",outline:"none",fontSize:14,fontFamily:"'DM Sans',sans-serif",color:C.dark,background:"transparent",width:"100%"}}/>
      </div>
    </div>
  );
}

// Strip junk keys that should never live in form state. An older bug
// merged 404 responses ({"error":"Not found"}) into the form via an
// unguarded ...spread; saveForm() then persisted that into localStorage,
// and from then on every generate-link POST carried the error key into
// the DB. Strip on read so contaminated browsers self-heal next load.
const _stripFormJunk = f => { if(f && typeof f === "object") delete f.error; return f; };

function calcOptions(form, taxRate) {
  const wetSF=parseFloat(form.wetSF)||0, rate=parseFloat(form.ratePSF)||0;
  const scanCost=parseFloat(form.scanCost)||0, numScans=parseInt(form.numScans)||0;
  const ventBase = wetSF * rate;
  const scanValue = scanCost * numScans;
  const tr = taxRate || 0;
  const build = (label, adj, splits) => {
    const adjusted = round2(ventBase * (1 + adj));
    const tax = round2(adjusted * tr);
    const total = round2(adjusted + tax);
    const achEligible = total >= 10000;
    const achTotal = achEligible ? round2(total - 100) : total;
    const payments = splits.map(s => ({...s, amount: round2(total * s.pct), achAmount: round2(achTotal * s.pct)}));
    return { label, adj, adjusted, tax, achEligible, total, achTotal, payments, scanValue, ventBase };
  };
  const opts = [
    build("Pay in Full", -0.03, [{ pct:1.0, label:"Full Payment", due:"Due upon contract execution" }]),
    build("50% Now. 50% at Install.", 0, [{ pct:0.50, label:"Deposit (50%)", due:"Due upon contract execution" },{ pct:0.50, label:"Balance (50%)", due:"Due upon ReDry vent installation" }]),
    build("Let\u2019s Get Going!", 0.03, [{ pct:0.10, label:"Deposit (10%)", due:"Due upon contract execution \u2014 2-Way Vents ship immediately" },{ pct:0.40, label:"Install Payment (40%)", due:"Due when ready for install \u2014 ReDry vent install scheduled 3 weeks out" },{ pct:0.50, label:"Final Payment (50%)", due:"Due upon ReDry vent installation" }]),
  ];
  // Custom option (index 3)
  const customPmts = (form.customOptionPayments || []).map(p => ({ pct: (parseFloat(p.pct)||0)/100, label: p.label||"Payment", due: p.due||"" }));
  const customAdj = (parseFloat(form.customOptionAdj)||0)/100;
  opts.push(build(form.customOptionLabel || "Custom", customAdj, customPmts.length > 0 ? customPmts : [{ pct:1.0, label:"Full Payment", due:"" }]));
  return opts;
}

// ─── Roof MRI Scan defaults & content ───
// Every process claim below is sourced from ReDry field-training recordings.
// Two wordings are deliberate: "non-destructive" is scoped to the SCANNING
// phase, and the pin-probe step is disclosed as "minimally invasive" because
// it penetrates the membrane and is sealed afterward. Never write
// the un-hyphenated "invasive"-negation, any "zero penetrations" phrasing, or
// an absolute "100%" qualifier on non-destructive. A smoke check enforces this.
const MRI_TIER_1_MAX_SF = 100000, MRI_TIER_2_MAX_SF = 200000;
const MRI_TIER_1_PRICE = 4000, MRI_TIER_2_PRICE = 6000;
const mriBaseline = sf => { const n = parseFloat(sf) || 0;
  if (n <= 0) return 0; if (n < MRI_TIER_1_MAX_SF) return MRI_TIER_1_PRICE;
  if (n <= MRI_TIER_2_MAX_SF) return MRI_TIER_2_PRICE; return 0; };
const mriLinePrice = row => { const o = String(row.price ?? "").trim();
  return o !== "" ? (parseFloat(o) || 0) : mriBaseline(row.sf); };
const mriTotals = form => {
  const rows = form.scanAddresses || [];
  return { subtotal: rows.reduce((a, r) => a + mriLinePrice(r), 0),
           totalSF: rows.reduce((a, r) => a + (parseFloat(r.sf) || 0), 0) };
};

    const adjusted = round2(ventBase * (1 + adj));
    const tax = round2(adjusted * tr);
    const subtotal = round2(adjusted + tax);
    const total = round2(subtotal + installFee);
    const achEligible = total >= 10000;
    const achTotal = achEligible ? round2(total - 100) : total;
    const payments = splits.map(s => ({...s, amount: round2(total * s.pct), achAmount: round2(achTotal * s.pct)}));
    return { label, adj, adjusted, tax, achEligible, total, achTotal, payments, ventBase, installFee, leaseTerm, numVents };
  };
  return [build("Pay in Full", 0, [{ pct:1.0, label:"Full Payment", due:"Due upon contract execution" }])];
}

        <Inp label="Wet Insulation (SF)" value={form.wetSF} onChange={s("wetSF")} placeholder="11600" type="number" required third/>
        <Inp label="Rate" value={form.ratePSF} onChange={s("ratePSF")} prefix="$" suffix="/ SF" type="number" third/>
        <Inp label="Scan Cost" value={form.scanCost} onChange={s("scanCost")} prefix="$" suffix="/ scan" type="number" third/>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:12,marginBottom:4}}>
        <Inp label="Number of Scans" value={form.numScans} onChange={s("numScans")} type="number" third/>
        <Inp label="Scan Interval" value={form.scanInterval} onChange={s("scanInterval")} suffix="months" type="number" third/>
        <Inp label="Proposal Date" value={form.proposalDate} onChange={s("proposalDate")} type="date" third/>
        <Inp label="Valid Days" value={form.validDays} onChange={s("validDays")} suffix="days" type="number" third/>
      </div>

      <div style={{display:"flex",flexWrap:"wrap",gap:12,alignItems:"flex-end",marginBottom:4}}>
        <div style={{flex:"0 0 31%",minWidth:140}}>
          <label style={{display:"block",fontSize:12,fontWeight:600,color:C.navy,marginBottom:4}}>Rental Tax Rate</label>
          <div style={{display:"flex",alignItems:"center",background:"#f1f5f9",border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 12px",fontSize:14,color:C.dark}}>
            {form.projectState ? <>{fmtPct(taxRate)} <span style={{fontSize:12,color:C.gray,marginLeft:6}}>({form.projectState.toUpperCase()} state rate)</span></> : <span style={{color:C.gray}}>Enter state to auto-detect</span>}
          </div>
        </div>
        <div style={{flex:"0 0 31%",minWidth:140,display:"flex",flexDirection:"column",gap:6,paddingBottom:2}}>
          <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,fontWeight:600,color:C.navy}}>
            <input type="checkbox" checked={form.waiveScans} onChange={e=>setForm(f=>({...f,waiveScans:e.target.checked}))}
              style={{width:18,height:18,accentColor:C.orange,cursor:"pointer"}}/>
            Waive scan fees (added value)
          </label>
          <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,fontWeight:600,color:C.navy}}>
            <input type="checkbox" checked={form.hideScans} onChange={e=>setForm(f=>({...f,hideScans:e.target.checked}))}
              style={{width:18,height:18,accentColor:C.orange,cursor:"pointer"}}/>
            Hide scans from proposal
          </label>
          <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,fontWeight:600,color:C.navy}}>
            <input type="checkbox" checked={form.hidePricing} onChange={e=>setForm(f=>({...f,hidePricing:e.target.checked}))}
              style={{width:18,height:18,accentColor:C.orange,cursor:"pointer"}}/>
            Hide all pricing (complimentary)
          </label>
        </div>
      </div>

      {wetSF>0 && !form.hidePricing && <div style={{marginTop:20}}>
        <div style={{fontSize:13,fontWeight:700,color:C.navy,marginBottom:10,textTransform:"uppercase",letterSpacing:0.5}}>Payment Options</div>

        {/* Option toggles */}
        <div style={{display:"flex",gap:16,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
          {["Pay in Full","50% Now. 50% at Install.","Let\u2019s Get Going!"].map((name,i)=>(
            <label key={i} style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",fontSize:13,fontWeight:600,color:!!form[`showOption${i}`]?C.navy:C.gray}}>
              <input type="checkbox" checked={!!form[`showOption${i}`]} onChange={e=>setForm(f=>({...f,[`showOption${i}`]:e.target.checked}))}
                style={{width:16,height:16,accentColor:C.orange,cursor:"pointer"}}/>
              {name}
            </label>
          ))}
          <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",fontSize:13,fontWeight:600,color:form.showCustomOption?C.orange:C.gray}}>
            <input type="checkbox" checked={!!form.showCustomOption} onChange={e=>setForm(f=>({...f,showCustomOption:e.target.checked}))}
              style={{width:16,height:16,accentColor:C.orange,cursor:"pointer"}}/>
            Custom
          </label>
        </div>

        {/* Custom option builder */}
        {form.showCustomOption && <div style={{background:"#fef7ed",border:`1px solid ${C.orange}`,borderRadius:8,padding:16,marginBottom:14}}>
          <div style={{fontSize:12,fontWeight:700,color:C.orange,textTransform:"uppercase",letterSpacing:0.5,marginBottom:10}}>Custom Payment Option</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:12,marginBottom:12}}>
            <Inp label="Option Label" value={form.customOptionLabel} onChange={v=>setForm(f=>({...f,customOptionLabel:v}))} placeholder="e.g. Net 30" half/>
            <Inp label="Price Adjustment" value={form.customOptionAdj} onChange={v=>setForm(f=>({...f,customOptionAdj:v}))} suffix="%" type="number" half placeholder="0 = standard, -3 = discount, 3 = fee"/>
          </div>
          <div style={{fontSize:12,fontWeight:600,color:C.navy,marginBottom:8}}>Payment Schedule</div>
          {(form.customOptionPayments||[]).map((pmt,pi)=>(
            <div key={pi} style={{display:"flex",gap:8,marginBottom:8,alignItems:"flex-end"}}>
              <div style={{flex:"0 0 70px"}}>
                <label style={{display:"block",fontSize:11,fontWeight:600,color:C.navy,marginBottom:2}}>Split %</label>
                <input type="number" value={pmt.pct} onChange={e=>{const ps=[...(form.customOptionPayments||[])];ps[pi]={...ps[pi],pct:e.target.value};setForm(f=>({...f,customOptionPayments:ps}));}}
                  style={{width:"100%",padding:"6px 8px",border:`1px solid ${C.border}`,borderRadius:4,fontSize:13,outline:"none",boxSizing:"border-box"}}/>
              </div>
              <div style={{flex:1}}>
                <label style={{display:"block",fontSize:11,fontWeight:600,color:C.navy,marginBottom:2}}>Label</label>
                <input value={pmt.label} onChange={e=>{const ps=[...(form.customOptionPayments||[])];ps[pi]={...ps[pi],label:e.target.value};setForm(f=>({...f,customOptionPayments:ps}));}}
                  placeholder="e.g. Deposit (50%)" style={{width:"100%",padding:"6px 8px",border:`1px solid ${C.border}`,borderRadius:4,fontSize:13,outline:"none",boxSizing:"border-box"}}/>
              </div>
              <div style={{flex:1}}>
                <label style={{display:"block",fontSize:11,fontWeight:600,color:C.navy,marginBottom:2}}>Due</label>
                <input value={pmt.due} onChange={e=>{const ps=[...(form.customOptionPayments||[])];ps[pi]={...ps[pi],due:e.target.value};setForm(f=>({...f,customOptionPayments:ps}));}}
                  placeholder="e.g. Due upon execution" style={{width:"100%",padding:"6px 8px",border:`1px solid ${C.border}`,borderRadius:4,fontSize:13,outline:"none",boxSizing:"border-box"}}/>
              </div>
              {(form.customOptionPayments||[]).length>1 && <button onClick={()=>{const ps=[...(form.customOptionPayments||[])];ps.splice(pi,1);setForm(f=>({...f,customOptionPayments:ps}));}}
                style={{padding:"6px 10px",border:`1px solid ${C.red}`,borderRadius:4,background:"#fff",color:C.red,fontSize:12,fontWeight:700,cursor:"pointer",flexShrink:0,height:32}}>&#10005;</button>}
            </div>
          ))}
          <div style={{display:"flex",gap:8,alignItems:"center",marginTop:4}}>
            <button onClick={()=>setForm(f=>({...f,customOptionPayments:[...(f.customOptionPayments||[]),{pct:"",label:"",due:""}]}))}
              style={{padding:"6px 14px",border:`1px solid ${C.orange}`,borderRadius:4,background:"#fff",color:C.orange,fontSize:12,fontWeight:700,cursor:"pointer"}}>+ Add Payment</button>
            {(()=>{const t=(form.customOptionPayments||[]).reduce((s,p)=>s+(parseFloat(p.pct)||0),0); return <span style={{fontSize:11,color:t===100?C.green:"#dc2626",fontWeight:t===100?400:600}}>Total: {t}% {t!==100?"(must equal 100%)":"&#10003;"}</span>;})()}
          </div>
        </div>}

        {/* Shared pricing summary */}
        <div style={{background:"#f8fafc",borderRadius:8,padding:"12px 16px",marginBottom:12,fontSize:13,color:C.gray,lineHeight:1.7}}>
          <span style={{fontWeight:600,color:C.navy}}>Base:</span> {fmtN(wetSF)} SF &times; {fmtC(rate)}/SF = {fmtC(ventTotal)}
          {taxRate>0 && <span> &nbsp;|&nbsp; <span style={{fontWeight:600,color:C.navy}}>Tax:</span> {fmtPct(taxRate)}</span>}
          {options[0].achEligible && <span> &nbsp;|&nbsp; <span style={{fontWeight:600,color:C.green}}>$100 ACH discount</span> available</span>}
          {form.waiveScans && !form.hideScans && <span> &nbsp;|&nbsp; <span style={{fontWeight:600,color:C.green}}>{numScans} scans included</span> ({fmtC(scanCost*numScans)} value)</span>}
        </div>

        {/* Option cards */}
        <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
          {options.map((opt,oi)=>{
            if(oi<3 && !form[`showOption${oi}`]) return null;
            if(oi===3 && !form.showCustomOption) return null;
            const isCustom = oi===3;
            return (
            <div key={oi} style={{flex:"1 1 220px",background:isCustom?"#fef7ed":oi===1?"#fef7ed":"#f8fafc",border:`1px solid ${isCustom||oi===1?C.orange:C.border}`,borderRadius:8,padding:14,position:"relative"}}>
              {oi===1 && <div style={{position:"absolute",top:-8,right:12,background:C.orange,color:"#fff",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:4}}>DEFAULT</div>}
              {isCustom && <div style={{position:"absolute",top:-8,right:12,background:C.orange,color:"#fff",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:4}}>CUSTOM</div>}
              <div style={{fontSize:14,fontWeight:700,color:C.navy,marginBottom:6}}>{opt.label}</div>
              {opt.adj!==0 && <div style={{fontSize:11,color:opt.adj<0?C.green:C.orange,marginBottom:6}}>{opt.adj<0?`${Math.abs(opt.adj*100)}% discount applied`:`${Math.abs(opt.adj*100)}% convenience fee`}</div>}
              <div style={{fontSize:11,marginBottom:4}}>
                <div style={{display:"flex",justifyContent:"space-between",color:C.gray}}><span>Vent Lease</span><span>{fmtC(opt.adjusted)}</span></div>
                {opt.tax>0 && <div style={{display:"flex",justifyContent:"space-between",color:C.gray}}><span>Tax ({fmtPct(taxRate)})</span><span>{fmtC(opt.tax)}</span></div>}
{/* ACH discount not shown on proposal — applied at checkout only */}
              </div>
              <div style={{fontSize:20,fontWeight:800,color:C.navy,marginBottom:8,borderTop:`1px solid ${C.border}`,paddingTop:4}}>{fmtC(opt.total)}</div>
              {opt.payments.map((p,pi)=>(
                <div key={pi} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"4px 0",borderTop:pi===0?`1px solid ${C.border}`:"none",marginTop:pi===0?4:0}}>
                  <span style={{color:C.gray}}>{p.label}</span>
                  <span style={{fontWeight:700,color:C.navy}}>{fmtC(p.amount)}</span>
                </div>
              ))}
            </div>
          );})}
        </div>
      </div>}

      <SecLabel>Vent Placement Map</SecLabel>
      <div onClick={()=>fileRef.current?.click()}
        onDragOver={e=>{e.preventDefault();e.stopPropagation()}}
        onDrop={e=>{e.preventDefault();e.stopPropagation();const f=e.dataTransfer.files[0];if(f&&f.type.startsWith("image/"))setVentMapFile(f)}}
        style={{border:`2px dashed ${ventMapFile?C.orange:C.border}`,borderRadius:8,padding:24,textAlign:"center",cursor:"pointer",background:ventMapFile?"#fef7ed":"#fff"}}>
        <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>e.target.files[0]&&setVentMapFile(e.target.files[0])}/>
        {ventMapFile
          ? <div><div style={{fontSize:13,fontWeight:600,color:C.orange}}>&#10003; {ventMapFile.name}</div><div style={{fontSize:12,color:C.gray,marginTop:4}}>Click or drop to replace</div></div>
          : <div><div style={{fontSize:28,marginBottom:4}}>&#128206;</div><div style={{fontSize:13,fontWeight:600,color:C.navy}}>Drop vent placement map here</div><div style={{fontSize:12,color:C.gray,marginTop:4}}>or click to browse (PNG, JPG)</div></div>}
      </div>
    </div>

    <div style={{display:"flex",gap:12,marginTop:20}}>
      <button onClick={onPDF} disabled={!ok||loading} style={{flex:1,padding:"14px 0",border:"none",borderRadius:8,background:ok&&!loading?C.navy:"#cbd5e1",color:"#fff",fontSize:15,fontWeight:700,cursor:ok&&!loading?"pointer":"not-allowed",letterSpacing:0.5}}>
        {loading==="pdf"?"Generating...":"Download PDF"}
      </button>
      <button onClick={onLink} disabled={!ok||loading} style={{flex:1,padding:"14px 0",border:"none",borderRadius:8,background:ok&&!loading?C.orange:"#cbd5e1",color:"#fff",fontSize:15,fontWeight:700,cursor:ok&&!loading?"pointer":"not-allowed",letterSpacing:0.5}}>
        {loading==="link"?"Creating...":"Create Client Link"}
      </button>
    </div>

    {result && <div ref={resultRef} style={{marginTop:16,padding:16,background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8}}>
      {result.type==="pdf" && <div style={{fontSize:14,color:"#15803d",fontWeight:600}}>&#10003; PDF downloaded successfully!</div>}
      {result.type==="link" && <div>
        <div style={{fontSize:14,color:"#15803d",fontWeight:600,marginBottom:8}}>&#10003; Client proposal link created!</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <input readOnly value={`${window.location.origin}${result.clientUrl}`}
            style={{flex:1,padding:"8px 12px",border:`1px solid ${C.border}`,borderRadius:6,fontSize:13,fontFamily:"monospace",color:C.dark,background:"#fff"}}
            onClick={e=>e.target.select()}/>
          <button onClick={()=>navigator.clipboard.writeText(`${window.location.origin}${result.clientUrl}`)}
            style={{padding:"8px 16px",border:`1px solid ${C.border}`,borderRadius:6,background:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",color:C.navy,whiteSpace:"nowrap"}}>Copy</button>
        </div>
        <div style={{fontSize:12,color:C.gray,marginTop:6}}>Share this link with your client.
          <a href={result.clientUrl} target="_blank" rel="noopener" style={{color:C.orange,marginLeft:6,fontWeight:600}}>Preview &#8594;</a>
        </div>

        {/* Send to Client via Email */}
        <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid #bbf7d0"}}>
          {!result.emailSent ? (<div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <input value={result.sendEmail||form.clientEmail||""} onChange={e=>onSetResult(r=>({...r,sendEmail:e.target.value}))}
              placeholder="client@company.com" type="email"
              style={{flex:"1 1 200px",padding:"8px 12px",border:`1px solid ${C.border}`,borderRadius:6,fontSize:13,color:C.dark,background:"#fff",outline:"none"}}/>
            <button onClick={async()=>{
              const email = result.sendEmail||form.clientEmail;
              if(!email){alert("Enter an email address"); return;}
              onSetResult(r=>({...r,sending:true}));
              try{
                const res = await authFetch(`${API}/api/proposal/${result.proposalId}/send`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});
                const d = await res.json();
                if(d.sent) onSetResult(r=>({...r,emailSent:true,sending:false,sentTo:email}));
                else {alert("Failed to send: "+(d.error||"Unknown error")); onSetResult(r=>({...r,sending:false}));}
              }catch(e){ alert("Error sending email. Please try again."); onSetResult(r=>({...r,sending:false}));}
            }} disabled={result.sending}
              style={{padding:"8px 20px",border:"none",borderRadius:6,background:result.sending?"#cbd5e1":C.orange,color:"#fff",fontSize:13,fontWeight:700,cursor:result.sending?"wait":"pointer",whiteSpace:"nowrap"}}>
              {result.sending?"Sending...":"Send to Client"}
            </button>
          </div>) : (
            <div style={{fontSize:13,color:"#15803d",fontWeight:600}}>&#10003; Proposal emailed to {result.sentTo}</div>
          )}
        </div>

        {/* Send for Approval */}
        <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid #bbf7d0"}}>
          {!result.approvalSent ? (
            <button onClick={async()=>{
              onSetResult(r=>({...r,sendingApproval:true}));
              try{
                const res = await authFetch(`${API}/api/proposal/${result.proposalId}/send-for-approval`,{method:"POST",headers:{"Content-Type":"application/json"}});
                const d = await res.json();
                if(d.sent) onSetResult(r=>({...r,approvalSent:true,sendingApproval:false,approvalTo:d.to}));
                else {alert("Failed to send: "+(d.error||"Unknown error")); onSetResult(r=>({...r,sendingApproval:false}));}
              }catch(e){alert("Error: "+e.message); onSetResult(r=>({...r,sendingApproval:false}));}
            }} disabled={result.sendingApproval}
              style={{width:"100%",padding:"10px 20px",border:"2px solid #1B2A4A",borderRadius:6,background:result.sendingApproval?"#cbd5e1":"#fff",color:"#1B2A4A",fontSize:13,fontWeight:700,cursor:result.sendingApproval?"wait":"pointer"}}>
              {result.sendingApproval?"Sending...":"Send for Approval"}
            </button>
          ) : (
            <div style={{fontSize:13,color:"#15803d",fontWeight:600}}>&#10003; Approval request sent to {result.approvalTo}</div>
          )}
        </div>
      </div>}
    </div>}
  </div>);
}

// ─── FIXED LEASE BUILDER ───
function FixedLeaseBuilder({form,setForm,ventMapFile,setVentMapFile,onPDF,onLink,loading,result,onSetResult,taxRate,setTaxRate,onSearch,onDashboard,onBack}) {
  const fileRef = useRef();
  const resultRef = useRef();
  useEffect(()=>{ if(result && resultRef.current) resultRef.current.scrollIntoView({behavior:"smooth",block:"nearest"}); },[result]);
  const [presets,setPresetsState] = useState(loadFixedPresets());
  const [presetName,setPresetName] = useState("");
  const [showSavePreset,setShowSavePreset] = useState(false);
  const s = k => v => setForm(f=>({...f,[k]:v}));
  const numVents=parseInt(form.numVents)||0, ventRate=parseFloat(form.ventRate)||0;
  const leaseTerm=parseInt(form.leaseTerm)||12;
  const installFee=parseFloat(form.installFee)||0;
  const leaseTotal=numVents*ventRate;
  const ok = form.clientCompany && form.projectName && form.projectAddress && numVents>0;

  useEffect(()=>{ saveFixedForm(form); },[form]);

  useEffect(()=>{
    const st = form.projectState?.toUpperCase().trim();
    if(st && st.length===2){
      authFetch(`${API}/api/tax-rate?state=${st}`).then(r=>r.json()).then(d=>{
        if(d.rate !== undefined) setTaxRate(d.rate);
      }).catch(()=>{});
    }
  },[form.projectState]);

  const options = calcFixedOptions(form, taxRate);

  const doSavePreset = () => {
    if(!presetName.trim()) return;
    const p = [...presets, { name: presetName.trim(), data: {...form} }];
    setPresetsState(p); saveFixedPresets(p); setPresetName(""); setShowSavePreset(false);
  };
  const doLoadPreset = (preset) => {
    setForm(f=>({...f, ...preset.data, proposalDate: new Date().toISOString().split("T")[0], projectName:"", projectAddress:"", projectCity:"", projectState:"", projectZip:"", projectSection:"", numVents:"" }));
  };
  const doDeletePreset = (idx) => {
    const p = presets.filter((_,i)=>i!==idx);
    setPresetsState(p); saveFixedPresets(p);
  };
  const doClear = () => {
    setForm({...defaultFixedForm, proposalDate: new Date().toISOString().split("T")[0]});
  };

  return (<div style={{maxWidth:820,margin:"0 auto"}}>
    <div style={{textAlign:"center",marginBottom:32}}>
      <div style={{fontSize:11,fontWeight:700,color:C.orange,letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>ReDry Proposal Builder</div>
      <h1 style={{fontSize:28,fontWeight:800,color:C.navy,margin:0,fontFamily:"'Playfair Display',serif"}}>Fixed Lease Proposal</h1>
      <p style={{color:C.gray,fontSize:14,marginTop:6}}>Rent individual vents at a fixed rate per vent.</p>
      <div style={{display:"flex",gap:8,justifyContent:"center",marginTop:10}}>
        {onBack && <button onClick={onBack} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 18px",cursor:"pointer",fontSize:13,fontWeight:600,color:C.navy,transition:"all 0.15s"}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=C.orange;e.currentTarget.style.color=C.orange}} onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.navy}}>
          &larr; Lease Type
        </button>}
        {onSearch && <button onClick={onSearch} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 18px",cursor:"pointer",fontSize:13,fontWeight:600,color:C.navy,transition:"all 0.15s"}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=C.orange;e.currentTarget.style.color=C.orange}} onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.navy}}>
          &#128269; Past Proposals
        </button>}
        {onDashboard && <button onClick={onDashboard} style={{background:"none",border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 18px",cursor:"pointer",fontSize:13,fontWeight:600,color:C.navy,transition:"all 0.15s"}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=C.orange;e.currentTarget.style.color=C.orange}} onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.navy}}>
          &#128202; Dashboard
        </button>}
      </div>
    </div>

    {/* Presets Bar */}
    <div style={{marginBottom:16,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
      <span style={{fontSize:12,fontWeight:700,color:C.navy,letterSpacing:0.5}}>QUICK LOAD:</span>
      {presets.map((p,i)=>(
        <div key={i} style={{display:"flex",alignItems:"center",gap:0}}>
          <button className="preset-btn" onClick={()=>doLoadPreset(p)}>{p.name}</button>
          <button onClick={()=>doDeletePreset(i)} style={{background:"none",border:"none",color:C.gray,cursor:"pointer",fontSize:14,padding:"0 4px",lineHeight:1}} title="Remove">&times;</button>
        </div>
      ))}
      {!showSavePreset
        ? <button className="preset-btn" onClick={()=>setShowSavePreset(true)} style={{borderStyle:"dashed",color:C.orange}}>+ Save Current</button>
        : <div style={{display:"flex",gap:4,alignItems:"center"}}>
            <input value={presetName} onChange={e=>setPresetName(e.target.value)} placeholder="Preset name" onKeyDown={e=>e.key==="Enter"&&doSavePreset()}
              style={{padding:"5px 10px",border:`1px solid ${C.border}`,borderRadius:6,fontSize:12,width:180,outline:"none"}}/>
            <button className="preset-btn" onClick={doSavePreset} style={{background:C.orange,color:"#fff",borderColor:C.orange}}>Save</button>
            <button className="preset-btn" onClick={()=>setShowSavePreset(false)}>Cancel</button>
          </div>}
      <button className="preset-btn" onClick={doClear} style={{marginLeft:"auto",color:C.red,borderColor:"#fecaca"}}>Clear Form</button>
    </div>

    <div style={{background:"#fff",borderRadius:12,border:`1px solid ${C.border}`,padding:28,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>

      <div style={{display:"flex",flexWrap:"wrap",gap:12,marginBottom:4}}><Inp label="Company Name" value={form.clientCompany} onChange={s("clientCompany")} placeholder="L.D. Tebben Company" required autoComplete="organization"/></div>
      <div style={{display:"flex",flexWrap:"wrap",gap:12,marginBottom:4}}>
        <Inp label="Contact Name" value={form.clientContact} onChange={s("clientContact")} placeholder="Justin Boren" half autoComplete="name"/>
        <Inp label="Title" value={form.clientTitle} onChange={s("clientTitle")} placeholder="Senior Technical Estimator" half autoComplete="organization-title"/>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:12}}>
        <Inp label="Phone" value={form.clientPhone} onChange={s("clientPhone")} placeholder="(512) 663-9226" half autoComplete="tel"/>
        <Inp label="Email" value={form.clientEmail} onChange={s("clientEmail")} placeholder="jboren@ldtebben.com" half autoComplete="email"/>
      </div>

      <SecLabel>Project Details</SecLabel>
      <div style={{display:"flex",flexWrap:"wrap",gap:12,marginBottom:4}}><Inp label="Project Name" value={form.projectName} onChange={s("projectName")} placeholder="Crockett High School" required/></div>
      <div style={{display:"flex",flexWrap:"wrap",gap:12,marginBottom:4}}>
        <AddressAutocomplete value={form.projectAddress} onChange={s("projectAddress")} placeholder="5601 Menchaca Rd" required
          onPlaceSelect={({address,city,state,zip})=>{
            setForm(f=>({...f, projectAddress:address, projectCity:city, projectState:state, projectZip:zip}));
          }}/>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:12,marginBottom:4}}>
        <Inp label="City" value={form.projectCity} onChange={s("projectCity")} placeholder="Austin" third autoComplete="address-level2"/>
        <Inp label="State" value={form.projectState} onChange={s("projectState")} placeholder="TX" third autoComplete="address-level1"/>
        <Inp label="ZIP" value={form.projectZip} onChange={s("projectZip")} placeholder="78745" third autoComplete="postal-code"/>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:12}}>
        <Inp label="Section / Area" value={form.projectSection} onChange={s("projectSection")} placeholder="North Section" half/>
      </div>

      <SecLabel>Shipping Address</SecLabel>
      <p style={{fontSize:12,color:C.gray,margin:"0 0 8px",lineHeight:1.5}}>Where should we ship the vents? Leave blank if same as project address.</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:12,marginBottom:4}}>
        <AddressAutocomplete value={form.shipAddress} onChange={s("shipAddress")} placeholder="123 Warehouse Blvd"
          onPlaceSelect={({address,city,state,zip})=>{
            setForm(f=>({...f, shipAddress:address, shipCity:city, shipState:state, shipZip:zip}));
          }}/>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:12}}>
        <Inp label="City" value={form.shipCity} onChange={s("shipCity")} placeholder="Austin" third autoComplete="address-level2"/>
        <Inp label="State" value={form.shipState} onChange={s("shipState")} placeholder="TX" third autoComplete="address-level1"/>
        <Inp label="ZIP" value={form.shipZip} onChange={s("shipZip")} placeholder="78745" third autoComplete="postal-code"/>
      </div>

      <SecLabel>Pricing</SecLabel>
      <div style={{display:"flex",flexWrap:"wrap",gap:12,marginBottom:4}}>
        <Inp label="Number of Vents" value={form.numVents} onChange={s("numVents")} placeholder="5" type="number" required third/>
        <Inp label="Rate per Vent" value={form.ventRate} onChange={s("ventRate")} prefix="$" suffix="/ vent" type="number" third/>
        <Inp label="Lease Term" value={form.leaseTerm} onChange={s("leaseTerm")} suffix="months" type="number" third/>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:12,marginBottom:4}}>
        <Inp label="Install / Setup Fee" value={form.installFee} onChange={s("installFee")} prefix="$" type="number" third/>
        <Inp label="Proposal Date" value={form.proposalDate} onChange={s("proposalDate")} type="date" third/>
        <Inp label="Valid Days" value={form.validDays} onChange={s("validDays")} suffix="days" type="number" third/>
      </div>

      <div style={{display:"flex",flexWrap:"wrap",gap:12,alignItems:"flex-end",marginBottom:4}}>
        <div style={{flex:"0 0 31%",minWidth:140}}>
          <label style={{display:"block",fontSize:12,fontWeight:600,color:C.navy,marginBottom:4}}>Rental Tax Rate</label>
          <div style={{display:"flex",alignItems:"center",background:"#f1f5f9",border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 12px",fontSize:14,color:C.dark}}>
            {form.projectState ? <>{fmtPct(taxRate)} <span style={{fontSize:12,color:C.gray,marginLeft:6}}>({form.projectState.toUpperCase()} state rate)</span></> : <span style={{color:C.gray}}>Enter state to auto-detect</span>}
          </div>
        </div>
      </div>

      {numVents>0 && <div style={{marginTop:20}}>
        <div style={{fontSize:13,fontWeight:700,color:C.navy,marginBottom:10,textTransform:"uppercase",letterSpacing:0.5}}>Payment — Due in Full</div>
        <div style={{background:"#f8fafc",borderRadius:8,padding:"14px 18px",fontSize:13,color:C.gray,lineHeight:1.8}}>
          <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:600,color:C.navy}}>Vent Rental</span><span>{numVents} &times; {fmtC(ventRate)} = {fmtC(leaseTotal)}</span></div>
          {taxRate>0 && <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:600,color:C.navy}}>Tax ({fmtPct(taxRate)})</span><span>{fmtC(options[0].tax)}</span></div>}
          {installFee>0 && <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:600,color:C.navy}}>Install Fee</span><span>{fmtC(installFee)}</span></div>}
          {leaseTerm !== 12 && <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:600,color:C.navy}}>Lease Term</span><span>{leaseTerm} months</span></div>}
          <div style={{display:"flex",justifyContent:"space-between",borderTop:`1px solid ${C.border}`,paddingTop:6,marginTop:6}}><span style={{fontWeight:800,color:C.navy,fontSize:15}}>Total Due</span><span style={{fontWeight:800,color:C.navy,fontSize:15}}>{fmtC(options[0].total)}</span></div>
          {options[0].achEligible && <div style={{color:C.green,fontSize:12,marginTop:4}}>Save $100 when paying via ACH / bank transfer</div>}
        </div>
      </div>}

      {ventMapFile ? <>
        <SecLabel>Vent Placement Map</SecLabel>
        <div onClick={()=>fileRef.current?.click()}
          style={{border:`2px dashed ${C.orange}`,borderRadius:8,padding:24,textAlign:"center",cursor:"pointer",background:"#fef7ed"}}>
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>e.target.files[0]&&setVentMapFile(e.target.files[0])}/>
          <div style={{fontSize:13,fontWeight:600,color:C.orange}}>&#10003; {ventMapFile.name}</div>
          <div style={{display:"flex",gap:8,justifyContent:"center",marginTop:6}}>
            <span style={{fontSize:12,color:C.gray}}>Click to replace</span>
            <span style={{fontSize:12,color:C.red,cursor:"pointer",textDecoration:"underline"}} onClick={e=>{e.stopPropagation();setVentMapFile(null);}}>Remove</span>
          </div>
        </div>
      </> : <div style={{marginTop:16}}>
        <button onClick={()=>fileRef.current?.click()}
          style={{background:"none",border:`1px dashed ${C.border}`,borderRadius:6,padding:"8px 16px",cursor:"pointer",fontSize:12,fontWeight:600,color:C.gray}}>
          + Add Vent Placement Map (optional)
        </button>
        <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>e.target.files[0]&&setVentMapFile(e.target.files[0])}/>
      </div>}
    </div>

    <div style={{display:"flex",gap:12,marginTop:20}}>
      <button onClick={onPDF} disabled={!ok||loading} style={{flex:1,padding:"14px 0",border:"none",borderRadius:8,background:ok&&!loading?C.navy:"#cbd5e1",color:"#fff",fontSize:15,fontWeight:700,cursor:ok&&!loading?"pointer":"not-allowed",letterSpacing:0.5}}>
        {loading==="pdf"?"Generating...":"Download PDF"}
      </button>
      <button onClick={onLink} disabled={!ok||loading} style={{flex:1,padding:"14px 0",border:"none",borderRadius:8,background:ok&&!loading?C.orange:"#cbd5e1",color:"#fff",fontSize:15,fontWeight:700,cursor:ok&&!loading?"pointer":"not-allowed",letterSpacing:0.5}}>
        {loading==="link"?"Creating...":"Create Client Link"}
      </button>
    </div>

    {result && <div ref={resultRef} style={{marginTop:16,padding:16,background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8}}>
      {result.type==="pdf" && <div style={{fontSize:14,color:"#15803d",fontWeight:600}}>&#10003; PDF downloaded successfully!</div>}
      {result.type==="link" && <div>
        <div style={{fontSize:14,color:"#15803d",fontWeight:600,marginBottom:8}}>&#10003; Client proposal link created!</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <input readOnly value={`${window.location.origin}${result.clientUrl}`}
            style={{flex:1,padding:"8px 12px",border:`1px solid ${C.border}`,borderRadius:6,fontSize:13,fontFamily:"monospace",color:C.dark,background:"#fff"}}
            onClick={e=>e.target.select()}/>
          <button onClick={()=>navigator.clipboard.writeText(`${window.location.origin}${result.clientUrl}`)}
            style={{padding:"8px 16px",border:`1px solid ${C.border}`,borderRadius:6,background:"#fff",fontSize:13,fontWeight:600,cursor:"pointer",color:C.navy,whiteSpace:"nowrap"}}>Copy</button>
        </div>
        <div style={{fontSize:12,color:C.gray,marginTop:6}}>Share this link with your client.
          <a href={result.clientUrl} target="_blank" rel="noopener" style={{color:C.orange,marginLeft:6,fontWeight:600}}>Preview &#8594;</a>
        </div>

        <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid #bbf7d0"}}>
          {!result.emailSent ? (<div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <input value={result.sendEmail||form.clientEmail||""} onChange={e=>onSetResult(r=>({...r,sendEmail:e.target.value}))}
              placeholder="client@company.com" type="email"
              style={{flex:"1 1 200px",padding:"8px 12px",border:`1px solid ${C.border}`,borderRadius:6,fontSize:13,color:C.dark,background:"#fff",outline:"none"}}/>
            <button onClick={async()=>{
              const email = result.sendEmail||form.clientEmail;
              if(!email){alert("Enter an email address"); return;}
              onSetResult(r=>({...r,sending:true}));
              try{
                const r=await authFetch(`${API}/api/proposal/${result.proposalId}/send`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});
                const d=await r.json();
                if(d.sent) onSetResult(r=>({...r,emailSent:true,sentTo:email,sending:false}));
                else { alert(d.error||"Failed to send"); onSetResult(r=>({...r,sending:false})); }
              }catch(e){ alert("Failed to send email"); onSetResult(r=>({...r,sending:false})); }
            }} disabled={result.sending}
              style={{padding:"8px 16px",border:"none",borderRadius:6,background:C.orange,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",opacity:result.sending?0.6:1}}>
              {result.sending?"Sending...":"Send to Client"}
            </button>
          </div>) : (
            <div style={{fontSize:13,color:"#15803d",fontWeight:600}}>&#10003; Sent to {result.sentTo}</div>
          )}
        </div>

        <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid #bbf7d0"}}>
          {!result.approvalSent ? (
            <button onClick={async()=>{
              onSetResult(r=>({...r,sendingApproval:true}));
              try{
                const r=await authFetch(`${API}/api/proposal/${result.proposalId}/send-for-approval`,{method:"POST"});
                const d=await r.json();
                if(d.sent) onSetResult(r=>({...r,approvalSent:true,approvalTo:d.to,sendingApproval:false}));
                else { alert(d.error||"Failed"); onSetResult(r=>({...r,sendingApproval:false})); }
              }catch(e){ alert("Failed"); onSetResult(r=>({...r,sendingApproval:false})); }
            }} disabled={result.sendingApproval}
              style={{padding:"8px 16px",border:`1px solid ${C.navy}`,borderRadius:6,background:"#fff",color:C.navy,fontSize:13,fontWeight:700,cursor:"pointer",opacity:result.sendingApproval?0.6:1}}>
              {result.sendingApproval?"Sending...":"Send for Approval"}
            </button>
          ) : (
            <div style={{fontSize:13,color:"#15803d",fontWeight:600}}>&#10003; Approval request sent to {result.approvalTo}</div>
          )}
        </div>
      </div>}
    </div>}
  </div>);
}

// ─── CLIENT PROPOSAL VIEW ───
function ClientView({form, ventMapUrl, proposalId, onBack}) {
  const [sigName,setSigName]=useState(""), [sigDate,setSigDate]=useState("");
  const [accepted,setAccepted]=useState(false), [submitting,setSubmitting]=useState(false);
  const [selectedOption,setSelectedOption]=useState(null);
  const [termsOk,setTermsOk]=useState(false);
  const [payingWith,setPayingWith]=useState("card");
  const savedTaxRate = parseFloat(form.taxRate) || 0;
  const [taxRate,setTaxRate]=useState(savedTaxRate);
  const [paymentSuccess,setPaymentSuccess]=useState(false);

  const wetSF=parseFloat(form.wetSF)||0, rate=parseFloat(form.ratePSF)||0;
  const scanCost=parseFloat(form.scanCost)||0, numScans=parseInt(form.numScans)||0;
  const ventTotal=wetSF*rate;
  const pn=propNum(form.proposalDate), vt=addDays(form.proposalDate,parseInt(form.validDays)||30);
  const addr=[form.projectAddress,[form.projectCity,form.projectState].filter(Boolean).join(", "),form.projectZip].filter(Boolean).join(", ");
  const interval=form.scanInterval||"3";

  useEffect(()=>{
    const params = new URLSearchParams(window.location.search);
    if(params.get("payment")==="success") {
      setPaymentSuccess(true);
      const sessionId = params.get("session_id")||"";
      const opt = parseInt(params.get("option"))||1;
      const pmt = parseInt(params.get("pmt"))||1;
      const amt = parseInt(params.get("amt"))||0;
      const method = params.get("method")||"card";
      if(proposalId) {
        fetch(`${API}/api/proposal/${proposalId}/payment-confirm`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({sessionId, option:opt, paymentNumber:pmt, amount:amt, method:method})
        }).catch(()=>{});
      }
      window.history.replaceState({}, "", window.location.pathname);
    }
  },[]);

  // If no saved taxRate, try to fetch from API (fallback for old proposals)
  useEffect(()=>{
    if(savedTaxRate > 0) { setTaxRate(savedTaxRate); return; }
    const st = form.projectState?.toUpperCase().trim();
    if(st && st.length===2){
      fetch(`${API}/api/tax-rate?state=${st}`).then(r=>{if(!r.ok)throw new Error();return r.json();}).then(d=>{
        if(d.rate !== undefined) setTaxRate(d.rate);
      }).catch(()=>{});
    }
  },[form.projectState]);

  const options = calcOptions(form, taxRate);
  const visibleOptions = options.map((opt,oi)=>({opt,oi})).filter(({oi})=> {
    if(oi===3) return !!form.showCustomOption;
    return form[`showOption${oi}`] === undefined || form[`showOption${oi}`] === true;
  });

  // Auto-select if only one option visible
  const visibleCount = visibleOptions.length;
  const singleOptionIndex = visibleCount === 1 ? visibleOptions[0].oi : null;
  useEffect(()=>{
    if(singleOptionIndex !== null && selectedOption === null) setSelectedOption(singleOptionIndex);
  },[singleOptionIndex]);

  // No checkout is initiated from the proposal. The client chooses a pricing
  // option and a preferred payment method; ReDry invoices separately. The
  // ?payment=success handler above is retained only to record a payment that
  // was collected elsewhere, never to start one.

  const doAccept = async()=>{
    if(!sigName||!sigDate||!termsOk||(selectedOption===null && !form.hidePricing))return;
    setSubmitting(true);
    try{
      if(proposalId) {
        const r = await fetch(`${API}/api/proposal/${proposalId}/accept`,{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({name:sigName,date:sigDate,selectedOption:selectedOption!==null?selectedOption+1:null,
            paymentMethod:form.hidePricing?null:payingWith, warrantyAccepted:termsOk, warrantyVersion:WARRANTY_VERSION})});
        if(r.status===409){ alert("This proposal has already been accepted."); setSubmitting(false); return; }
        if(!r.ok){ alert("Failed to submit acceptance. Please try again."); setSubmitting(false); return; }
      }
      setAccepted(true);
    }catch(e){ alert("Network error. Please check your connection and try again."); }
    setSubmitting(false);
  };

  const SH=(n,t)=>(<div style={{marginTop:36,marginBottom:12}}><h2 style={{fontSize:17,fontWeight:800,color:C.navy,margin:0,fontFamily:"'Playfair Display',serif"}}>{n}. {t}</h2><div style={{height:2,width:50,background:C.orange,marginTop:6}}/></div>);
  const P=({children})=>(<p style={{fontSize:14,lineHeight:1.7,color:"#374151",margin:"8px 0",textAlign:"justify"}}>{children}</p>);
  const B=({html})=>(<div style={{display:"flex",gap:10,marginBottom:6,fontSize:14,lineHeight:1.65,color:"#374151"}}><span style={{color:C.orange,fontWeight:700,flexShrink:0}}>&#8226;</span><span dangerouslySetInnerHTML={{__html:html}}/></div>);
  const Sub=({t})=>(<h3 style={{fontSize:14,fontWeight:700,color:C.navy,margin:"16px 0 8px"}}>{t}</h3>);

  if(accepted) return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center",maxWidth:540,padding:40}}>
        <div style={{width:72,height:72,borderRadius:"50%",background:"#dcfce7",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 20px",fontSize:32}}>&#10003;</div>
        <h1 style={{fontSize:26,fontWeight:800,color:C.navy,fontFamily:"'Playfair Display',serif",marginBottom:8}}>Agreement Signed</h1>
        <p style={{color:C.gray,fontSize:15,lineHeight:1.6}}>Thank you. Your signature has been recorded and a copy of the signed agreement is on its way to your inbox.</p>
        <div style={{marginTop:24,padding:16,background:"#fff",borderRadius:8,border:`1px solid ${C.border}`,fontSize:13,color:C.gray,textAlign:"left"}}>
          <div>Signed by: <strong style={{color:C.dark}}>{sigName}</strong></div>
          <div>Date: <strong style={{color:C.dark}}>{sigDate}</strong></div>
          {selectedOption!==null && <div>Selected: <strong style={{color:C.dark}}>{options[selectedOption]?.label || `Option ${selectedOption+1}`}</strong></div>}
          {!form.hidePricing && <div>Preferred payment: <strong style={{color:C.dark}}>{payingWith==="ach"?"ACH / Bank Transfer":"Credit Card"}</strong></div>}
          <div>Warranty: <strong style={{color:C.dark}}>Limited Material Warranty Agreement accepted</strong></div>
        </div>
        {!form.hidePricing && <div style={{marginTop:20,padding:"16px 18px",background:"#fff",borderRadius:8,border:`1px solid ${C.border}`,borderLeft:`3px solid ${C.orange}`,textAlign:"left"}}>
          <div style={{fontSize:14,fontWeight:700,color:C.navy,marginBottom:6}}>What happens next</div>
          <p style={{fontSize:13,color:C.gray,lineHeight:1.7,margin:0}}>
            No payment was collected today. <strong style={{color:C.dark}}>You will receive an invoice separately</strong> for
            {" "}{(options[selectedOption]?.label || "the selected option").replace(/\.\s*$/,"")}, payable by {payingWith==="ach"?"ACH / bank transfer":"credit card"}.
            The ReDry team will also reach out to coordinate scheduling.
          </p>
        </div>}
        <div style={{marginTop:16,fontSize:12,color:C.gray}}>
          <a href="/warranty" target="_blank" rel="noopener" style={{color:C.gray,textDecoration:"underline"}}>View the Limited Material Warranty Agreement</a>
        </div>
      </div>
    </div>
  );

  return (<div style={{minHeight:"100vh",background:C.bg}}>
    <div style={{background:C.navy,padding:"10px 0"}}>
      <div style={{maxWidth:820,margin:"0 auto",padding:"0 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{color:"#fff",fontSize:13,fontWeight:600,letterSpacing:1}}>RE<span style={{color:C.orange}}>DRY</span></span>
        <div style={{display:"flex",gap:8}}>
          {proposalId && <a href={`${API}/api/proposal/${proposalId}/pdf`} target="_blank" rel="noopener" style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",color:"#fff",padding:"5px 14px",borderRadius:4,fontSize:12,textDecoration:"none"}}>PDF</a>}
        </div>
      </div>
    </div>
    {paymentSuccess && <div style={{background:"#f0fdf4",borderBottom:"1px solid #bbf7d0",padding:"12px 20px",textAlign:"center"}}>
      <span style={{color:"#15803d",fontWeight:600,fontSize:14}}>&#10003; Payment received! Thank you.</span>
    </div>}
    <div style={{maxWidth:820,margin:"0 auto",padding:"32px 20px 60px"}}>
      <div style={{background:"#fff",borderRadius:12,border:`1px solid ${C.border}`,overflow:"hidden",marginBottom:24}}>
        <div style={{height:4,background:C.orange}}/>
        <div style={{padding:"28px 32px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:16}}>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:C.orange,letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>Proposal</div>
              <h1 style={{fontSize:26,fontWeight:800,color:C.navy,margin:0,fontFamily:"'Playfair Display',serif"}}>{form.projectName||"Project"}</h1>
              <div style={{fontSize:14,color:C.gray,marginTop:4}}>{addr}</div>
              {form.projectSection && <div style={{fontSize:14,color:C.gray}}>{form.projectSection}</div>}
            </div>
            <div style={{textAlign:"right",fontSize:13,color:C.gray,lineHeight:1.7}}><div>{pn}</div><div>{fmtDate(form.proposalDate)}</div><div>Valid through {vt}</div></div>
          </div>
          <div style={{display:"flex",gap:32,marginTop:24,paddingTop:20,borderTop:`1px solid ${C.border}`,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:200}}>
              <div style={{fontSize:10,fontWeight:700,color:C.orange,letterSpacing:1.5,textTransform:"uppercase",marginBottom:6}}>From</div>
              <div style={{fontSize:14,color:C.dark,lineHeight:1.7}}><strong>ReDry, LLC</strong><br/>Adam Capps, Founder<br/>865.771.3848<br/>adam@re-dry.com</div>
            </div>
            <div style={{flex:1,minWidth:200}}>
              <div style={{fontSize:10,fontWeight:700,color:C.orange,letterSpacing:1.5,textTransform:"uppercase",marginBottom:6}}>To</div>
              <div style={{fontSize:14,color:C.dark,lineHeight:1.7}}>
                <strong>{form.clientCompany||"\u2014"}</strong>
                {form.clientContact && <><br/>{form.clientContact}</>}
                {form.clientTitle && <><br/>{form.clientTitle}</>}
                {form.clientPhone && <><br/>{form.clientPhone}</>}
                {form.clientEmail && <><br/>{form.clientEmail}</>}
              </div>
            </div>
          </div>

// ─── PIPELINE / ANALYTICS ───
function MiniBarChart({data}) {
  // Inline SVG, no chart libs. Pair of bars per month: sent (navy) + signed
  // (green). Heights are count-based; the <title> tooltips carry the $ value
  // so the chart stays scannable but the detail is one hover away.
  if(!data || !data.length) return <div style={{color:C.gray,fontSize:12,padding:20,textAlign:"center"}}>No data yet.</div>;
  const maxCount = Math.max(1, ...data.map(d=>Math.max(d.sentCount, d.signedCount)));
  const colW = 18, gap = 4, padL = 24, padT = 8, padB = 16;
  const chartH = 80;
  const totalW = padL + data.length * (colW + gap);
  const totalH = chartH + padT + padB;
  const yFor = c => padT + (chartH - (c/maxCount) * chartH);
  return (
    <svg viewBox={`0 0 ${totalW} ${totalH}`} style={{width:"100%",height:"auto",display:"block"}} preserveAspectRatio="xMinYMid meet">
      <line x1={padL} y1={padT+chartH} x2={totalW} y2={padT+chartH} stroke={C.border}/>
      {data.map((d, i) => {
        const x = padL + i * (colW + gap);
        const sentH = chartH - (yFor(d.sentCount) - padT);
        const signH = chartH - (yFor(d.signedCount) - padT);
        return (
          <g key={d.month}>
            <rect x={x} y={yFor(d.sentCount)} width={(colW/2)-1} height={sentH} fill={C.navy}>
              <title>{`${d.label}: sent ${d.sentCount} (${fmtC(d.sentValue)})`}</title>
            </rect>
            <rect x={x+colW/2+1} y={yFor(d.signedCount)} width={(colW/2)-1} height={signH} fill={C.green}>
              <title>{`${d.label}: signed ${d.signedCount} (${fmtC(d.signedValue)})`}</title>
            </rect>
            <text x={x+colW/2} y={padT+chartH+10} fontSize={6} fill={C.gray} textAnchor="middle">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

function DeltaBadge({pct}) {
  if(pct === null || pct === undefined) return <span style={{color:C.gray,fontSize:11}}>—</span>;
  const up = pct >= 0;
  const color = up ? C.green : "#dc2626";
  const arrow = up ? "▲" : "▼";
  const sign = up ? "+" : "";
  return <span style={{color,fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>{arrow} {sign}{(pct*100).toFixed(0)}%</span>;
}

      </div>

            style={{flex:"1 1 200px",padding:"8px 12px",border:`1px solid ${C.border}`,borderRadius:6,fontSize:13,color:C.dark,background:"#fff",outline:"none"}}/>
          <button onClick={async()=>{
            const email = result.sendEmail||form.clientEmail;
            if(!email){alert("Enter an email address"); return;}
            onSetResult(r=>({...r,sending:true}));
            try{
              const r=await authFetch(`${API}/api/proposal/${result.proposalId}/send`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});

            }catch(e){ alert("Failed to send email"); onSetResult(r=>({...r,sending:false})); }
          }} disabled={result.sending}
            style={{padding:"8px 16px",border:"none",borderRadius:6,background:C.orange,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",opacity:result.sending?0.6:1}}>
            {result.sending?"Sending...":"Send to Client"}
          </button>
        </div>) : (<div style={{fontSize:13,color:"#15803d",fontWeight:600}}>&#10003; Sent to {result.sentTo}</div>)}
      </div>
    </div>}
  </div>);
}

function EventTimeline({pid}) {
  const [events, setEvents] = useState(null);
  const [err, setErr] = useState(false);
  useEffect(() => {
    let cancel = false;
    authFetch(`${API}/api/proposal/${pid}/events`)
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(d => { if(!cancel) setEvents(Array.isArray(d) ? d : []); })
      .catch(() => { if(!cancel) setErr(true); });
    return () => { cancel = true; };
  }, [pid]);
  // Colors by event type. Unknown types render generically (forward-
  // compatible: PR 3 will add overview_viewed without touching this).
  const dotColor = t => ({
    created: "#94a3b8",
    sent: "#3b82f6",
    viewed: "#8b5cf6",
    overview_viewed: C.orange,
    signed: C.green,
    payment: C.green,
    approval_requested: C.navy,
  }[t] || C.gray);
  const labelFor = t => ({
    created: "Created",
    sent: "Sent",
    viewed: "Viewed",
    overview_viewed: "Overview viewed",
    signed: "Signed",
    payment: "Payment received",
    approval_requested: "Sent for approval",
  }[t] || t);
  const detailLine = e => {
    const d = e.details || {};
    if(e.type === "sent" || e.type === "approval_requested") return d.to ? `to ${d.to}` : "";
    if(e.type === "viewed" || e.type === "overview_viewed") return d.ip ? `${d.ip}` : "";
    if(e.type === "payment") {
      const amt = d.amountCents ? `$${(d.amountCents/100).toLocaleString("en-US",{minimumFractionDigits:2})}` : "";
      const meth = d.method ? ` via ${d.method.toUpperCase()}` : "";
      return `${amt}${meth}`.trim();
    }
    if(e.type === "signed") return d.signerName ? `by ${d.signerName}` : "";
    return "";
  };
  const fmt = d => d ? new Date(d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}) : "";
  if(err) return <div style={{color:C.gray,fontSize:12,padding:8}}>Could not load event history.</div>;
  if(events === null) return <div style={{color:C.gray,fontSize:12,padding:8}}>Loading activity…</div>;
  if(events.length === 0) return <div style={{color:C.gray,fontSize:12,padding:8}}>No activity logged yet.</div>;
  return (
    <div style={{padding:"8px 4px"}}>
      <div style={{fontSize:11,fontWeight:700,color:C.gray,textTransform:"uppercase",letterSpacing:0.5,marginBottom:8}}>Activity</div>
      {events.map((e, i) => (
        <div key={i} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"6px 0",borderBottom:i<events.length-1?`1px solid ${C.border}`:"none"}}>
          <div style={{width:10,height:10,borderRadius:"50%",background:dotColor(e.type),marginTop:5,flexShrink:0}}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:13,color:C.navy,fontWeight:600}}>{labelFor(e.type)}</div>
            {detailLine(e) && <div style={{fontSize:12,color:C.gray,marginTop:1}}>{detailLine(e)}</div>}
          </div>
          <div style={{fontSize:11,color:C.gray,whiteSpace:"nowrap"}}>{fmt(e.at)}</div>
        </div>
      ))}
    </div>
  );
}

        </div>

    {!loading && filtered.length > 0 && <div style={{textAlign:"center",color:C.gray,fontSize:12,marginTop:12}}>

function App() {
  const [view,setView] = useState("loading");
  const [leaseType,setLeaseType] = useState(null);
  const [form,setForm] = useState(loadForm);
  const [fixedForm,setFixedForm] = useState(loadFixedForm);
  const [mriForm,setMriForm] = useState(loadMriForm);
  const [ventMapFile,setVentMapFile] = useState(null);
  const [ventMapUrl,setVentMapUrl] = useState(null);
  const [mriImageUrls,setMriImageUrls] = useState([]);
  const [loading,setLoading] = useState(null);
  const [result,setResult] = useState(null);
  const [proposalId,setProposalId] = useState(null);
  const [taxRate,setTaxRate] = useState(0);
  const [authed,setAuthed] = useState(false);

  // Keyed lookup rather than nested ternaries; `performance` stays the
  // default so legacy rows with no leaseType keep working.
  const FORMS = {fixed:[fixedForm,setFixedForm], roofmri:[mriForm,setMriForm], performance:[form,setForm]};
  const [activeForm, setActiveForm] = FORMS[leaseType] || FORMS.performance;

  useEffect(()=>{
    const path = window.location.pathname;
    // Standalone warranty page. Public and static — no proposal data, no
    // auth, no view logging. Linked from proposal terms and signing emails.
    if(/^\/warranty\/?$/.test(path)) { setView("warranty"); return; }
    const match = path.match(/^\/proposal\/([a-f0-9]+)$/);
    if(match) {
      const id = match[1];
      setProposalId(id);
      fetch(`${API}/api/proposal/${id}`).then(r=>{
        if(!r.ok) throw new Error("not found");
        return r.json();
      }).then(cfg=>{
        if(cfg.error) throw new Error(cfg.error);
        const ventFile = cfg._ventMapFilename;
        delete cfg._ventMapFilename; delete cfg._createdAt;
        if(cfg.leaseType === "roofmri") {
          setLeaseType("roofmri");
          setMriForm(f=>({...f,...cfg}));
        } else if(cfg.leaseType === "fixed") {
          setLeaseType("fixed");
          setFixedForm(f=>({...f,...cfg}));
        } else {
          setLeaseType("performance");
          setForm(f=>({...f,...cfg}));
        }
        if(ventFile) setVentMapUrl(`${API}/api/proposal/${id}/ventmap`);
        if(cfg.leaseType === "roofmri") {
          const n = (cfg.scanAddresses||[]).length;
          setMriImageUrls(Array.from({length:n},(_,i)=>`${API}/api/proposal/${id}/ventmap/${i}`));
        }
        setAuthed(true);
        setView("client");
      }).catch(()=>{setView("not-found");});
    } else {
      fetch(`${API}/api/auth/check`).then(r=>r.json()).then(d=>{
        if(d.authenticated || !d.authRequired) { setAuthed(true); setView("lease-select"); }
        else setView("login");
      }).catch(()=>setView("login"));
    }
  },[]);

  useEffect(()=>{
    // Roof MRI keeps an ARRAY here (one overhead per address) and previews
    // each image inside its own row, so only build a single-file preview URL
    // for the lease builders. Passing an array to createObjectURL throws and
    // would blank the entire app via the ErrorBoundary.
    if(ventMapFile instanceof Blob){
      const u=URL.createObjectURL(ventMapFile);setVentMapUrl(u);
      return()=>URL.revokeObjectURL(u);
    }
  },[ventMapFile]);

  const doLogout=()=>{
    authFetch(`${API}/api/auth/logout`,{method:"POST"}).finally(()=>{
      _authToken="";setAuthed(false);setView("login");
    });
  };

  const buildFD=()=>{
    const fd=new FormData();
    const cfg={...activeForm, taxRate:String(taxRate), leaseType: leaseType || "performance"};
    delete cfg.taxRateOverride;
    fd.append("config",JSON.stringify(cfg));
    // Roof MRI carries one overhead per address, so ventMapFile may be an
    // array. The server reads request.files.getlist("ventMap") either way.
    if(Array.isArray(ventMapFile)) ventMapFile.forEach(f=>{ if(f) fd.append("ventMap",f); });
    else if(ventMapFile) fd.append("ventMap",ventMapFile);
    return fd;
  };

  const validateForm=()=>{
    if(leaseType==="roofmri"){
      const rows=activeForm.scanAddresses||[];
      if(!rows.length || !rows.some(r=>String(r.address||"").trim())){
        alert("Add at least one address to scan."); return false;
      }
      if(mriTotals(activeForm).subtotal<=0){
        alert("Enter square footage (or a custom price) so the scan can be priced."); return false;
      }
      return true;
    }
    if(leaseType==="performance" && activeForm.showCustomOption){
      const t=(activeForm.customOptionPayments||[]).reduce((s,p)=>s+(parseFloat(p.pct)||0),0);
      if(t!==100){alert(`Custom option payment percentages must equal 100% (currently ${t}%).`);return false;}
    }
    return true;
  };

  const doPDF=async()=>{
    if(!validateForm())return;
    setLoading("pdf");setResult(null);
    try{
      const r=await authFetch(`${API}/api/generate-pdf`,{method:"POST",body:buildFD()});
      if(!r.ok)throw new Error("fail");
      const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement("a");
      a.href=u;a.download=`ReDry_Proposal_${activeForm.projectName.replace(/\s+/g,"_")}_${activeForm.projectSection.replace(/\s+/g,"_")}.pdf`;
      a.click();URL.revokeObjectURL(u);setResult({type:"pdf"});
    }catch(e){alert("Failed to generate PDF.");}
    setLoading(null);
  };

  const doLink=async()=>{
    if(!validateForm())return;
    setLoading("link");setResult(null);
    try{
      const r=await authFetch(`${API}/api/generate-proposal-link`,{method:"POST",body:buildFD()});
      if(!r.ok)throw new Error("fail");
      const d=await r.json();setResult({type:"link",...d});setProposalId(d.proposalId);
    }catch(e){alert("Failed to create link.");}
    setLoading(null);
  };

  if(view==="loading") return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:C.gray}}>Loading...</div>;
  if(view==="warranty") return <WarrantyView/>;
  if(view==="not-found") return (<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg}}>
    <div style={{textAlign:"center",padding:40}}>
      <div style={{width:72,height:72,borderRadius:"50%",background:"#fef2f2",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 20px",fontSize:32,color:"#dc2626"}}>!</div>
      <h1 style={{fontSize:24,fontWeight:800,color:C.navy,fontFamily:"'Playfair Display',serif"}}>Proposal Not Found</h1>
      <p style={{color:C.gray,fontSize:14,marginTop:8,lineHeight:1.6}}>This proposal link may be invalid or expired.</p>
    </div>
  </div>);
  if(view==="login") return <LoginScreen onLogin={()=>{setAuthed(true);setView("lease-select");}}/>;
  if(view==="lease-select") return <LeaseTypeSelector onSelect={(type)=>{setLeaseType(type);setResult(null);setView("form");}} onSearch={()=>setView("search")} onDashboard={()=>setView("dashboard")} onLogout={doLogout}/>;
  if(view==="client") {
    if(leaseType==="roofmri") return <RoofMRIClientView form={mriForm} proposalId={proposalId} imageUrls={mriImageUrls}/>;
    if(leaseType==="fixed") return <FixedLeaseClientView form={fixedForm} ventMapUrl={ventMapUrl} proposalId={proposalId} onBack={null}/>;
    return <ClientView form={form} ventMapUrl={ventMapUrl} proposalId={proposalId} onBack={null}/>;
  }
  if(view==="dashboard") return (<div style={{padding:"40px 20px"}}><Dashboard onBack={()=>setView("lease-select")}/></div>);
  if(view==="search") return (<div style={{padding:"40px 20px"}}><ProposalSearch onBack={()=>setView("lease-select")} onLoad={(pid)=>{
    authFetch(`${API}/api/proposal/${pid}`).then(r=>{
      if(!r.ok) throw new Error("Proposal not found");
      return r.json();
    }).then(cfg=>{
      // Defensive: never merge an error response into the form. The
      // unguarded merge below previously persisted {"error":"Not found"}
      // into form state -> localStorage -> every subsequent generate-link
      // call -> the DB. Also strip the key from the loaded config in case
      // an older proposal in the DB still has it.
      if(cfg && cfg.error) throw new Error(cfg.error);
      const ventFile = cfg._ventMapFilename;
      delete cfg._ventMapFilename; delete cfg._createdAt; delete cfg.error;
      if(cfg.leaseType === "roofmri") {
        setLeaseType("roofmri");
        setMriForm(f=>({...f,...cfg}));
      } else if(cfg.leaseType === "fixed") {
        setLeaseType("fixed");
        setFixedForm(f=>({...f,...cfg}));
      } else {
        setLeaseType("performance");
        setForm(f=>({...f,...cfg}));
      }
      setProposalId(pid);
      // Refresh the share-link panel so Copy/Send target the proposal we
      // just loaded — otherwise it keeps showing whatever link was created
      // most recently (which would point at a different proposal entirely).
      setResult({type:"link", proposalId:pid, clientUrl:`/proposal/${pid}`, pdfUrl:`/api/proposal/${pid}/pdf`});
      if(ventFile) setVentMapUrl(`${API}/api/proposal/${pid}/ventmap`);
      else { setVentMapUrl(null); setVentMapFile(null); }
      setView("form");
    }).catch(()=>alert("Failed to load proposal."));
  }}/></div>);
  if(leaseType==="roofmri") return (<div style={{padding:"40px 20px"}}><RoofMRIBuilder form={mriForm} setForm={setMriForm} ventMapFile={ventMapFile} setVentMapFile={setVentMapFile} onPDF={doPDF} onLink={doLink} loading={loading} result={result} onSetResult={setResult} onSearch={()=>setView("search")} onDashboard={()=>setView("dashboard")} onBack={()=>setView("lease-select")}/></div>);
  if(leaseType==="fixed") return (<div style={{padding:"40px 20px"}}><FixedLeaseBuilder form={fixedForm} setForm={setFixedForm} ventMapFile={ventMapFile} setVentMapFile={setVentMapFile} onPDF={doPDF} onLink={doLink} loading={loading} result={result} onSetResult={setResult} taxRate={taxRate} setTaxRate={setTaxRate} onSearch={()=>setView("search")} onDashboard={()=>setView("dashboard")} onBack={()=>setView("lease-select")}/></div>);
  return (<div style={{padding:"40px 20px"}}><BuilderForm form={form} setForm={setForm} ventMapFile={ventMapFile} setVentMapFile={setVentMapFile} onPDF={doPDF} onLink={doLink} loading={loading} result={result} onSetResult={setResult} taxRate={taxRate} setTaxRate={setTaxRate} onSearch={()=>setView("search")} onDashboard={()=>setView("dashboard")} onBack={()=>setView("lease-select")}/></div>);
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  render() {
    if (this.state.hasError) return React.createElement("div", {style:{padding:40,textAlign:"center"}},
      React.createElement("h2", {style:{color:"#dc2626"}}, "Something went wrong"),
      React.createElement("pre", {style:{fontSize:12,color:"#64748b",marginTop:12,textAlign:"left",maxWidth:600,margin:"12px auto",whiteSpace:"pre-wrap"}}, String(this.state.error))
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ErrorBoundary, null, React.createElement(App)));
</script>
</body>
</html>
